هِ يَدِي.", "tr": "Hādhihi yadī."}], "id": "Ini tangan saya.", "aid": "Apa ini?", "aar": "مَا هَذِهِ؟", "bid": "Ini tangan saya.", "bar": "هَذِهِ يَدِي."}, {"n": "538", "v": [{"l": "", "ar": "هَذِهِ رِجْلِي.", "tr": "Hādhihi rijlī."}], "id": "Ini kaki saya.", "aid": "Apa ini?", "aar": "مَا هَذِهِ؟", "bid": "Ini kaki saya.", "bar": "هَذِهِ رِجْلِي."}]}}, "all": [["التحية والمناسبات والضيافة", "Salam, Perayaan, dan Keramahan"], ["التعارف", "Perkenalan"], ["وصف الأشخاص والجسم", "Deskripsi Orang dan Tubuh"], ["اللغة", "Bahasa"], ["الشكر والاعتذار والأدب", "Terima Kasih, Maaf, dan Sopan Santun"], ["الموافقة والرفض والرأي", "Setuju, Menolak, dan Pendapat"], ["الوداع", "Perpisahan"], ["الأسرة", "Keluarga"], ["المنزل", "Rumah"], ["أعمال المنزل والمشكلات", "Pekerjaan Rumah dan Masalah"], ["الحياة اليومية", "Kehidupan Sehari-hari"], ["الأرقام والوقت والتاريخ", "Angka, Waktu, dan Tanggal"], ["الطعام والشراب", "Makanan dan Minuman"], ["المطعم", "Restoran"], ["التسوق والسوق", "Belanja dan Pasar"], ["الملابس والألوان", "Pakaian dan Warna"], ["المال والدفع", "Uang dan Pembayaran"], ["المدرسة والجامعة", "Sekolah dan Universitas"], ["العمل", "Pekerjaan"], ["الهاتف والإنترنت والتقنية", "Telepon, Internet, dan Teknologi"], ["الأماكن والاتجاهات والمدينة", "Tempat, Arah, dan Kota"], ["المواصلات وسيارة الأجرة", "Transportasi dan Taksi"], ["السفر والمطار والفندق", "Perjalanan, Bandara, dan Hotel"], ["الطقس", "Cuaca"], ["الصحة والطبيب والصيدلية", "Kesehatan, Dokter, dan Apotek"], ["المشاعر", "Perasaan"], ["الأصدقاء والهوايات", "Teman dan Hobi"], ["الحيوانات", "Hewan"], ["طلب المساعدة والأوامر", "Meminta Bantuan dan Perintah"], ["الأسئلة", "Pertanyaan"], ["الطوارئ", "Keadaan Darurat"], ["العبارات الدينية والدعاء", "Ungkapan Islami dan Doa"]]};
const QUIZ={1:'quiz-1.html',2:'quiz-2.html',3:'quiz-3.html'};
const READY=[1,2,3];
const $=s=>document.querySelector(s);
const ui=$('#ui'),stage=$('#stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();

/* ---------- audio ---------- */
let token=0,curAudio=null,voice=null,rate=0.85,auto=true;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/^ar/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function stopAudio(){token++;try{speechSynthesis.cancel()}catch(e){}if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}document.querySelectorAll('.spk.play').forEach(e=>e.classList.remove('play'))}
function tts(text){return new Promise(res=>{
  if(!('speechSynthesis' in window)){res();return}
  const u=new SpeechSynthesisUtterance(text.replace(/[،؟]/g,' '));u.lang='ar-SA';if(voice)u.voice=voice;u.rate=rate;
  let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,15000);
  speechSynthesis.speak(u);
  if(!voice&&!speechSynthesis.getVoices().length)$('#warn').textContent='';
})}
function playKey(key,text){return new Promise(res=>{
  let fell=false;const fb=()=>{if(fell)return;fell=true;tts(text).then(res)};
  const a=new Audio('audio/'+key+'.mp3');a.playbackRate=rate;curAudio=a;a.onerror=fb;a.onended=()=>res();
  const p=a.play();if(p&&p.catch)p.catch(fb);
})}
async function speak(key,text,btn){stopAudio();const my=token;if(btn)btn.classList.add('play');await playKey(key,text);if(btn&&my===token)btn.classList.remove('play')}
async function seq(list){stopAudio();const my=token;for(const [k,t,b] of list){if(my!==token)return;const btn=b?document.getElementById(b):null;if(btn)btn.classList.add('play');await playKey(k,t);if(btn)btn.classList.remove('play');await new Promise(r=>setTimeout(r,350))}}
window.sp=(k,t,id)=>speak(k,t,document.getElementById(id));

/* ---------- pieces ---------- */
const SPK='<svg viewBox="0 0 64 64"><path d="M8 24h12l16-13v42L20 40H8z" fill="#fff"/><path d="M42 22a14 14 0 0 1 0 20M48 14a24 24 0 0 1 0 36" stroke="#f2c651" stroke-width="5" fill="none" stroke-linecap="round"/></svg>';
const LOCK='<svg class="lk" viewBox="0 0 64 64"><path d="M18 30V20A14 14 0 0 1 46 20V30H40V20A8 8 0 0 0 24 20V30ZM10 30H54V60H10Z" fill="#f2c651"/></svg>';
const LOGO='<svg viewBox="0 0 120 120"><path d="M70 22a38 38 0 1 0 0 76a30 30 0 1 1 0-76z" fill="#f2c651"/><path d="M82 40l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z" fill="#fff"/></svg>';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
function head(title,ribbon){return `<div class="pill">${title}</div><div class="banner"><div class="logo">${LOGO}</div><div class="t1">العربية الفصحى</div><div class="t2">aL-ARABIYA aL-FUSHA</div></div><div class="badge"><div class="c">A1</div><div class="p">Pemula</div></div>${ribbon?`<div class="ribbon">${ribbon}</div>`:''}`}
function nav(prev,next,pl,nl){return `<button class="nbtn" style="left:50px" onclick="${prev}"><i>←</i>${pl}</button>${next?`<button class="nbtn" style="right:50px;flex-direction:row-reverse" onclick="${next}"><i>→</i>${nl}</button>`:''}`}
function speaker(id,key,text){return `<button class="spk" id="${id}" onclick="sp('${key}','${esc(text).replace(/\\/g,'')}','${id}')">${SPK}</button>`}
function tools(){return `<div id="tools"><div class="tool">Kecepatan · السرعة<div class="row"><button class="${rate==0.6?'on':''}" onclick="setRate(0.6)">🐢</button><button class="${rate==0.85?'on':''}" onclick="setRate(0.85)">🙂</button><button class="${rate==1?'on':''}" onclick="setRate(1)">🐇</button></div></div><div class="tool">Otomatis · تلقائي<div class="row"><button class="${auto?'on':''}" onclick="setAuto(true)">ON</button><button class="${!auto?'on':''}" onclick="setAuto(false)">OFF</button></div></div></div>`}
window.setRate=r=>{rate=r;render()};window.setAuto=a=>{auto=a;render(true)};

/* ---------- state ---------- */
let S={v:'hub',t:0,i:0};
function slides(t){
  const T=D.topics[t],L=[{k:'cover'}];
  T.items.forEach((it,j)=>{L.push({k:'s',j});L.push({k:'d',j})});
  L.push({k:'end'});return L;
}
function go(h){location.hash=h}
function parse(){
  const h=location.hash.slice(1)||'hub';
  if(h==='hub'||h==='lessons'||h==='quizzes')S={v:h};
  else{const m=h.match(/^t(\d+)\/(\d+)$/);if(m)S={v:'t',t:+m[1],i:+m[2]};else S={v:'hub'}}
  render();
}
addEventListener('hashchange',parse);

function render(keep){
  if(!keep)stopAudio();
  let h='';
  if(S.v==='hub'){
    h=head('A1<small>Pilih menu</small>','Level A1 · Pemula — Pilih menu belajar')+
    `<a class="hcard" style="left:290px" href="#lessons"><div class="ic"><svg viewBox="0 0 64 64"><path d="M8 14q12-4 24 4q12-8 24-4v38q-12-4-24 4q-12-8-24-4z" fill="#fff"/><path d="M32 18v38" stroke="#165138" stroke-width="3"/></svg></div><div class="a">الدروس</div><div class="i">PELAJARAN</div><div class="s">Slide kalimat + contoh dialog + audio</div></a>
     <a class="hcard" style="left:1010px" href="#quizzes"><div class="ic"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#fff"/><path d="M19 33l9 9 18-20" stroke="#165138" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="a">الاختبارات</div><div class="i">KUIS</div><div class="s">Latihan interaktif per topik</div></a>
     <div id="hint">Listen • Repeat • Understand • Use</div>`;
  }else if(S.v==='lessons'||S.v==='quizzes'){
    const q=S.v==='quizzes';
    let g='';
    D.all.forEach((p,k)=>{
      const n=k+1,on=READY.includes(n),x=(k%4)*434,y=Math.floor(k/4)*78;
      const href=on?(q?QUIZ[n]:'#t'+n+'/0'):null;
      g+=`<${on?'a href="'+href+'"':'div'} class="gi ${on?'on':''}" style="left:${x}px;top:${y}px">${on?`<span class="no">${n}</span>`:LOCK}<div class="tx"><div class="ta">${p[0]}</div><div class="ti">${p[1]}</div></div></${on?'a':'div'}>`;
    });
    h=head(q?'KUIS':'PELAJARAN',q?'Pilih kuis · اختر الاختبار':'Pilih topik · اختر الموضوع')+`<div class="grid">${g}</div>`+nav("go('hub')",null,'Menu Utama','');
  }else{
    const T=D.topics[S.t],L=slides(S.t),s=L[S.i],last=L.length-1;
    const pt=`TOPIK ${S.t}<small>${esc(T.id)}</small>`;
    const rb=s.k==='s'?'Kalimat · الجملة':s.k==='d'?'Contoh dialog · حوار':s.k==='cover'?'Mulai belajar':'Ringkasan · مراجعة';
    h=head(pt,rb);
    let body='',autoList=null;
    if(s.k==='cover'){
      h+=`<div class="cover fade"><div class="meta">Topik ${S.t} · ${T.items.length} kalimat</div><div class="ar">${T.ar}</div><div class="id">${esc(T.id)}</div><button class="go" onclick="go('t${S.t}/1')">Mulai · ابدأ ←</button></div>`;
    }else if(s.k==='s'){
      const it=T.items[s.j],two=it.v.length>1;
      let cols='';autoList=[];
      it.v.forEach((v,q)=>{
        const id='sp'+q,key=it.n+(q?'f':'');
        autoList.push([key,v.ar,id]);
        cols+=`<div class="col ${two?'':'one'}">${v.l?`<span class="lab">${v.l}</span>`:''}<div class="ar">${v.ar}</div><div class="tr">${esc(v.tr)}</div>${speaker(id,key,v.ar)}</div>`;
      });
      h+=`<div class="card fade"><div class="numb">${it.n}</div><div class="cols">${cols}</div><div class="mean">${esc(it.id)}</div></div>`;
      window._al=autoList;
    }else if(s.k==='d'){
      const it=T.items[s.j];
      autoList=[[it.n+'a',it.aar,'sa'],[it.n+'b',it.bar,'sb']];
      h+=`<div class="card fade"><div class="numb">${it.n}</div>
       <div class="bub a"><div class="who">أ</div><div class="txt"><div class="ar">${it.aar.replace(/^أ:\s*/,'')}</div><div class="idn">${esc(it.aid)}</div></div>${speaker('sa',it.n+'a',it.aar.replace(/^أ:\s*/,''))}</div>
       <div class="bub b"><div class="who">ب</div><div class="txt"><div class="ar">${it.bar.replace(/^ب:\s*/,'')}</div><div class="idn">${esc(it.bid)}</div></div>${speaker('sb',it.n+'b',it.bar.replace(/^ب:\s*/,''))}</div>
       <button class="pdlg" onclick="seq(window._al)">▶ Putar dialog · شغّل الحوار</button></div>`;
      autoList=[[it.n+'a',it.aar.replace(/^أ:\s*/,''),'sa'],[it.n+'b',it.bar.replace(/^ب:\s*/,''),'sb']];
      window._al=autoList;
    }else{
      let rows='';T.items.forEach((it,j)=>{rows+=`<a href="#t${S.t}/${1+j*2}" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:2px 12px"><b style="color:var(--g);width:46px;font-size:20px">${it.n}</b><span class="ar" style="font-size:26px;font-weight:700;flex:1;color:var(--gd);white-space:nowrap;overflow:hidden">${it.v[0].ar}</span></a>`});
      h+=`<div class="card fade" style="overflow:auto;padding:26px 30px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${rows}</div></div>
      <a class="go" style="position:absolute;left:1560px;top:300px;width:320px;text-align:center;font-size:30px;padding:18px 10px;line-height:1.3;text-decoration:none" href="${QUIZ[S.t]}">Kuis topik ${S.t}<br>الاختبار ←</a>`;
    }
    const pv=S.i>0?`go('t${S.t}/${S.i-1}')`:"go('lessons')";
    const nx=S.i<last?`go('t${S.t}/${S.i+1}')`:`go('lessons')`;
    h+=`<div id="cnt">${S.i+1} / ${L.length}</div><div id="prog"><b style="width:${(S.i/last)*100}%"></b></div>`;
    h+=nav(pv,nx,S.i>0?'Sebelumnya':'Daftar isi',S.i<last?'Selanjutnya':'Selesai');
    if(s.k==='s'||s.k==='d')h+=tools();
    ui.innerHTML=h;
    if((s.k==='s'||s.k==='d')&&auto&&!keep)setTimeout(()=>seq(window._al),450);
    if(!('speechSynthesis' in window))$('#warn').textContent='Browser tidak mendukung suara · المتصفح لا يدعم الصوت';
    return;
  }
  ui.innerHTML=h;
}
addEventListener('keydown',e=>{
  if(S.v!=='t')return;const L=slides(S.t);
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')go('t'+S.t+'/'+Math.min(S.i+1,L.length-1));
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go('t'+S.t+'/'+Math.max(S.i-1,0));
  else if(e.key==='p')seq(window._al||[]);
});
let tx=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null||S.v!=='t')return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<90)return;const L=slides(S.t);
  go('t'+S.t+'/'+(dx<0?Math.min(S.i+1,L.length-1):Math.max(S.i-1,0)))},{passive:true});
parse();
</script>
